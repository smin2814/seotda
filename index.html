<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>온라인 섯다 관리</title>
<script src="/socket.io/socket.io.js"></script>
<style>
    :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --gray: #6b7280; --light: #f3f4f6; }
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background: var(--light); padding: 15px; font-size: 16px; }
    .view { display: none; background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .active { display: block; }
    h1, h2 { text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 1.1rem; }
    button { width: 100%; padding: 15px; margin: 8px 0; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-gray { background: var(--gray); }
    .board { background: #1f2937; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    .list { list-style: none; margin-bottom: 15px; }
    .list li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; }
    .my-turn { background: #eff6ff; border-left: 5px solid var(--primary); font-weight: bold; }
    .folded { text-decoration: line-through; opacity: 0.5; }
    .logs { background: var(--light); padding: 10px; height: 120px; overflow-y: auto; border-radius: 8px; font-size: 0.9rem; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .flex { display: flex; gap: 10px; }
</style>
</head>
<body>

<!-- 로비 -->
<div id="lobby" class="view active">
    <h1>섯다 온라인</h1>
    <input type="text" id="myName" placeholder="내 이름 입력 (예: 철수)">
    <button class="btn-primary" onclick="createRoom()">방 만들기 (방장)</button>
    <hr style="margin: 20px 0;">
    <input type="text" id="roomCode" placeholder="초대 코드 4자리 입력">
    <button class="btn-success" onclick="joinRoom()">방 참가하기</button>
</div>

<!-- 게임 대기방 -->
<div id="waiting" class="view">
    <h2>대기방 (코드: <span id="display-code" style="color:red;"></span>)</h2>
    <ul id="player-list" class="list"></ul>
    <button id="btn-start" class="btn-primary" style="display:none;" onclick="startGame()">게임 시작 (방장 전용)</button>
</div>

<!-- 게임 플레이 -->
<div id="play" class="view">
    <div class="board">
        <h3>팟: <span id="pot" style="color:#fbbf24;">0</span>원</h3>
        <p>최고 베팅: <span id="highest">0</span>원 | 이월금: <span id="dead">0</span>원</p>
    </div>
    <ul id="ingame-players" class="list"></ul>
    
    <div id="action-panel" style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:15px; display:none;">
        <h3 style="text-align:center; color:#2563eb; margin-bottom:10px;">내 차례입니다!</h3>
        <div class="action-grid">
            <button id="btn-check" class="btn-gray" onclick="action('check')">체크</button>
            <button id="btn-call" class="btn-success" onclick="action('call')">콜</button>
            <button id="btn-die" class="btn-danger" onclick="action('die')">다이</button>
        </div>
        <div class="flex" style="margin-top:10px;">
            <input type="number" id="raise-val" placeholder="최종금액 입력(1=100원)">
            <button class="btn-primary" onclick="action('raise')">베팅/레이즈</button>
        </div>
    </div>
    <div id="wait-msg" style="text-align:center; padding:20px; font-weight:bold; color:var(--gray);">다른 사람의 턴을 기다리는 중...</div>
    
    <div id="logs" class="logs"></div>
</div>

<!-- 정산 화면 (방장 전용) -->
<div id="settle" class="view">
    <h2>승자 정산 (방장 전용)</h2>
    <p style="text-align:center;">체크박스로 승자를 모두 선택하세요 (공동우승 가능)</p>
    <div id="winner-options" style="margin:20px 0;"></div>
    <button class="btn-primary" onclick="submitSettle(false)">선택한 사람 우승 처리</button>
    <button class="btn-gray" onclick="submitSettle(true)">무승부 (판돈 전액 이월)</button>
</div>

<script>
    const socket = io();
    let myId = null;
    let currentRoom = null;

    function show(id) {
        document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function createRoom() {
        const name = document.getElementById('myName').value.trim();
        if(!name) return alert('이름을 입력하세요');
        if (!socket.connected) return alert('서버 연결 중입니다. 잠시 후 다시 시도해주세요.');
        socket.emit('createRoom', { name });
    }

    function joinRoom() {
        const name = document.getElementById('myName').value.trim();
        const roomId = document.getElementById('roomCode').value.toUpperCase().trim();
        
        if(!name) return alert('이름을 입력하세요!');
        if(!roomId || roomId.length !== 4) return alert('올바른 4자리 코드를 입력하세요!');
        if (!socket.connected) return alert('서버 연결 중입니다. 잠시 후 다시 시도해주세요.');
        
        socket.emit('joinRoom', { name, roomId });
    }

    function startGame() { socket.emit('startGame'); }
    
    function action(type) {
        const data = { type };
        if (type === 'raise') {
            const val = parseInt(document.getElementById('raise-val').value);
            if (!val || val <= 0) return alert('금액을 입력하세요');
            data.amount = val * 100;
        }
        socket.emit('action', data);
        document.getElementById('raise-val').value = '';
    }

    function submitSettle(isDraw) {
        if(isDraw) {
            socket.emit('settle', { isDraw: true });
        } else {
            const checkboxes = document.querySelectorAll('input[name="winner"]:checked');
            const winners = Array.from(checkboxes).map(c => parseInt(c.value));
            if(winners.length === 0) return alert('최소 1명의 승자를 선택하세요.');
            socket.emit('settle', { isDraw: false, winners });
        }
    }

    socket.on('joined', data => { myId = data.myId; });
    socket.on('errorMsg', msg => alert(msg));
    
    socket.on('updateState', room => {
        currentRoom = room;
        const isHost = (room.hostId === myId);

        if (room.status === 'waiting') {
            show('waiting');
            document.getElementById('display-code').innerText = room.id;
            document.getElementById('player-list').innerHTML = room.players.map(p => `<li>${p.name} <span>누적: ${p.profit}원</span></li>`).join('');
            document.getElementById('btn-start').style.display = (isHost && room.players.length >= 2) ? 'block' : 'none';
        } 
        else if (room.status === 'playing') {
            show('play');
            document.getElementById('pot').innerText = room.pot;
            document.getElementById('highest').innerText = room.highestBet;
            document.getElementById('dead').innerText = room.deadMoney;
            
            const myTurn = (room.players[room.turnIndex].id === myId);
            document.getElementById('action-panel').style.display = myTurn ? 'block' : 'none';
            document.getElementById('wait-msg').style.display = myTurn ? 'none' : 'block';
            
            const me = room.players.find(x => x.id === myId);
            if(me) {
                if(room.isFirstAction) {
                    document.getElementById('btn-check').disabled = true;
                    document.getElementById('btn-call').disabled = true;
                } else {
                    if(me.bet === room.highestBet) {
                        document.getElementById('btn-check').disabled = false;
                        document.getElementById('btn-call').disabled = true;
                    } else {
                        document.getElementById('btn-check').disabled = true;
                        document.getElementById('btn-call').disabled = false;
                    }
                }
            }

            document.getElementById('ingame-players').innerHTML = room.players.map((p, idx) => {
                const turnCls = (idx === room.turnIndex && !p.isFolded) ? 'my-turn' : '';
                const foldCls = p.isFolded ? 'folded' : '';
                return `<li class="${turnCls} ${foldCls}">${p.name} <div>베팅: ${p.bet}원 (누적: ${p.profit})</div></li>`;
            }).join('');
            
            const logBox = document.getElementById('logs');
            logBox.innerHTML = room.logs.map(l => `<div>${l}</div>`).join('');
            logBox.scrollTop = logBox.scrollHeight;
        }
        else if (room.status === 'settle') {
            if (isHost) {
                show('settle');
                const active = room.players.filter(p => !p.isFolded);
                document.getElementById('winner-options').innerHTML = active.map(p => `
                    <label style="display:block; padding:10px; background:#f3f4f6; margin:5px 0;">
                        <input type="checkbox" name="winner" value="${room.players.indexOf(p)}"> ${p.name}
                    </label>
                `).join('');
            } else {
                show('play');
                document.getElementById('action-panel').style.display = 'none';
                document.getElementById('wait-msg').innerText = "방장이 승자를 정산 중입니다...";
            }
        }
    });
</script>
</body>
</html>
